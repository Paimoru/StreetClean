<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreetClean — Verify</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header" id="app-header"></header>

  <main>
    <span class="eyebrow">Step 5 of 5</span>
    <h1>Verify &amp; pay</h1>
    <p class="subtitle">Compare before and after, then release payment to the cleaner.</p>

    <div id="list"></div>
  </main>

  <nav class="bottom-nav" id="app-nav"></nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
  async function render() {
    const tasks = await DB.getPendingVerification();
    const list = document.getElementById("list");

    if (tasks.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="glyph">🔎</div>Nothing waiting on review right now.</div>`;
      return;
    }

    list.innerHTML = tasks
      .map(
        (t) => `
      <div class="card">
        <div class="task-title" style="margin-bottom:10px;">${escapeHtml(t.title)}</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
          <div>
            <label style="margin-bottom:4px;">Before</label>
            <div class="task-photo" style="height:100px; border-radius:8px;">
              ${t.photoBefore ? `<img src="${t.photoBefore}" alt="">` : `<span>📍</span>`}
            </div>
          </div>
          <div>
            <label style="margin-bottom:4px;">After</label>
            <div class="task-photo" style="height:100px; border-radius:8px;">
              ${t.photoAfter ? `<img src="${t.photoAfter}" alt="">` : `<span>🧹</span>`}
            </div>
          </div>
        </div>
        <div class="task-footer">
          <span class="bounty">₱${t.bounty} to release</span>
          <button class="btn btn-primary" onclick="verify('${t.id}')">Verify &amp; pay</button>
        </div>
      </div>`
      )
      .join("");
  }

  async function verify(id) {
    try {
      await DB.verifyAndPay(id);
      showToast("Verified — payment released 🎉");
      await render();
    } catch (err) {
      showToast(err.message || "Could not verify this cleanup.");
    }
  }

  startPage("verify", render, ["verifier"]);
</script>
</body>
</html>
