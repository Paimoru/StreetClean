<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreetClean — Browse Commissions</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header" id="app-header"></header>

  <main>
    <span class="eyebrow">Step 2 of 5</span>
    <h1>Open commissions</h1>
    <p class="subtitle">Claim one, clean it, submit proof, get paid.</p>

    <div id="list"></div>
  </main>

  <nav class="bottom-nav" id="app-nav"></nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
  async function render() {
    const tasks = await DB.getOpenTasks();
    const list = document.getElementById("list");

    if (tasks.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="glyph">✨</div>Nothing open right now — every spot is covered.</div>`;
      return;
    }

    list.innerHTML = tasks
      .map(
        (t) => `
      <div class="card task-card">
        <div class="task-photo">
          ${t.photoBefore ? `<img src="${t.photoBefore}" alt="">` : `<span style="font-size:34px;">📍</span>`}
        </div>
        <div class="task-body">
          <div class="task-title">${escapeHtml(t.title)}</div>
          <div class="task-meta">${escapeHtml(t.reporterName || "Resident")} · ${timeAgo(t.createdAt)}</div>
          <div class="task-desc">${escapeHtml(t.description)}</div>
          <div class="task-footer">
            <span class="bounty">₱${t.bounty}</span>
            <button class="btn btn-primary" onclick="claim('${t.id}')">Claim this</button>
          </div>
        </div>
      </div>`
      )
      .join("");
  }

  async function claim(id) {
    try {
      const task = await DB.claimTask(id);
      if (!task) {
        showToast("That commission was already claimed.");
        return;
      }
      showToast("Claimed! Head to My Tasks when it's cleaned.");
      await render();
    } catch (err) {
      showToast(err.message || "Could not claim commission.");
    }
  }

  startPage("commissions", render, ["cleaner"]);
</script>
</body>
</html>
