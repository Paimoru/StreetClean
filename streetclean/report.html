<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreetClean — Report</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header" id="app-header"></header>

  <main>
    <span class="eyebrow">Step 1 of 5</span>
    <h1>Report a dirty spot</h1>
    <p class="subtitle">Photograph it, name it, fund it — it becomes a live commission instantly.</p>

    <form id="report-form" class="card">
      <div class="field">
        <label for="title">Location</label>
        <input type="text" id="title" placeholder="e.g. Peñaranda Park, south entrance" required />
      </div>

      <div class="field">
        <label for="description">What's wrong here?</label>
        <textarea id="description" placeholder="Describe what needs cleaning" required></textarea>
      </div>

      <div class="field">
        <label for="bounty">Bounty (₱)</label>
        <input type="number" id="bounty" min="20" step="10" value="150" required />
      </div>

      <div class="field">
        <label for="photo">Before photo</label>
        <input type="file" id="photo" accept="image/*" capture="environment" />
        <div class="photo-preview" id="preview">No photo selected</div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Submit report &amp; fund commission</button>
    </form>
  </main>

  <nav class="bottom-nav" id="app-nav"></nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
  let photoData = null;
  const photoInput = document.getElementById("photo");
  const preview = document.getElementById("preview");

  photoInput.addEventListener("change", () => {
    readImageAsDataURL(photoInput, (dataUrl) => {
      photoData = dataUrl;
      preview.innerHTML = dataUrl
        ? `<img src="${dataUrl}" alt="">`
        : "No photo selected";
    });
  });

  document.getElementById("report-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = e.submitter;
    button.disabled = true;

    try {
      await DB.addReport({
        title: document.getElementById("title").value,
        description: document.getElementById("description").value,
        bounty: document.getElementById("bounty").value,
        photoBefore: photoData,
      });
      showToast("Report submitted — now live as a commission");
      setTimeout(() => (window.location.href = "index.html"), 700);
    } catch (err) {
      console.error(err);
      showToast(err.message || "Could not submit report");
      button.disabled = false;
    }
  });

  startPage("report", async () => {}, ["resident"]);
</script>
</body>
</html>
