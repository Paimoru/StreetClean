<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreetClean — My Tasks</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header" id="app-header"></header>

  <main>
    <span class="eyebrow">Steps 3–4 of 5</span>
    <h1>My tasks</h1>
    <p class="subtitle">Clean it, then upload an after photo to send it for verification.</p>

    <div id="list"></div>
  </main>

  <nav class="bottom-nav" id="app-nav"></nav>
</div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
  renderShell("mytasks");

  function render() {
    const tasks = DB.getMyTasks();
    const list = document.getElementById("list");

    if (tasks.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="glyph">🧹</div>You haven't claimed anything yet. Browse open commissions to get started.</div>`;
      return;
    }

    list.innerHTML = tasks
      .map((t) => {
        const claimedState = t.status === "claimed";
        return `
      <div class="card task-card">
        <div class="task-photo">
          ${t.photoBefore ? `<img src="${t.photoBefore}" alt="">` : `<span style="font-size:34px;">📍</span>`}
        </div>
        <div class="task-body">
          <div class="task-title">${t.title}</div>
          <div class="task-meta">₱${t.bounty} bounty · ${badgeFor(t.status)}</div>
          <div class="task-desc">${t.description}</div>

          ${
            claimedState
              ? `
            <div class="field">
              <label>Upload after photo</label>
              <input type="file" accept="image/*" capture="environment" id="file-${t.id}" onchange="preview('${t.id}')" />
              <div class="photo-preview" id="preview-${t.id}">No photo selected</div>
            </div>
            <button class="btn btn-primary btn-block" onclick="submitProof('${t.id}')">Submit for verification</button>
          `
              : `<p class="subtitle" style="margin:0;">Waiting on a verifier to confirm the cleanup.</p>`
          }
        </div>
      </div>`;
      })
      .join("");
  }

  const photoCache = {};

  function preview(id) {
    const input = document.getElementById("file-" + id);
    readImageAsDataURL(input, (dataUrl) => {
      photoCache[id] = dataUrl;
      document.getElementById("preview-" + id).innerHTML = dataUrl
        ? `<img src="${dataUrl}" alt="">`
        : "No photo selected";
    });
  }

  function submitProof(id) {
    if (!photoCache[id]) {
      showToast("Add an after photo first");
      return;
    }
    DB.submitProof(id, photoCache[id]);
    showToast("Sent for verification");
    render();
  }

  render();
</script>
</body>
</html>
