<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreetClean — Sign Up</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <a class="brand" href="index.html">
      <svg class="mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" stroke="white" stroke-width="6"/>
        <path d="M50 20 L58 45 L50 40 L42 45 Z M50 40 L50 78" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      StreetClean
    </a>
  </header>

  <main>
    <span class="eyebrow">Join</span>
    <h1>Create your account</h1>
    <p class="subtitle">Pick the role that matches what you'll do in the demo.</p>

    <form id="register-form" class="card">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" />
      </div>

      <div class="field">
        <label for="role">I am a</label>
        <select id="role" class="form-select">
          <option value="resident">Resident (reports litter)</option>
          <option value="cleaner">Cleaner (claims &amp; cleans)</option>
          <option value="verifier">Verifier (confirms &amp; pays)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      <p id="error-msg" style="color:#b3402f; font-size:13px; margin-top:10px; display:none;"></p>
    </form>

    <p class="subtitle" style="text-align:center;">
      Already have an account? <a href="login.html" style="color:var(--teal); font-weight:700;">Log in</a>
    </p>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    const errorMsg = document.getElementById("error-msg");
    errorMsg.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Creating account...";

    try {
      await AuthModule.registerUser(
        document.getElementById("name").value,
        document.getElementById("email").value,
        document.getElementById("password").value,
        document.getElementById("role").value
      );
      window.location.href = "index.html";
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
